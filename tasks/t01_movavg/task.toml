[task]
id = "t01_movavg"
function = "movavg"
trap = "indexing"

# Mean of k doubles: numpy (pairwise) and Octave (sequential) can differ by a few ulps.
# atol covers results that are almost zero, where a relative bound alone is too strict.
[tolerance]
rtol = 1e-12
atol = 1e-12

# The expected output is a 1xM row. A 1-D result of the same length is accepted
# (orientation is not what this task tests); an Mx1 column is not.
[shape]
vector_ok = true

# Arguments passed to the model's function as Python ints rather than floats.
[inputs]
order = ["x", "k"]
as_int = ["k"]

# Octave results of common wrong translations -> failure signature they indicate.
[known_wrong]
drop_first = "shifted-output"
drop_last = "shifted-output"
window_km1 = "window-mismatch"

# Ambiguity variant: the same function described in words. `vocabulary` is the words a reply uses when it
# says something about the vague point (how long the output is, and what happens at the edges). They are
# matched as whole words, a trailing * matches any ending, and none may appear in spec_ambiguous.md.
[ambiguity]
function = "movavg"
outputs = ["result"]
vocabulary = [
  "same length", "same size", "input length", "output length", "length of the output", "length of the result",
  "full window*", "partial window*", "valid", "pad", "padded", "padding", "zero-padded", "edge", "edges",
  "boundary", "boundaries", "n-k+1", "n - k + 1", "shorter", "fewer", "trailing", "centered", "centred",
  "'same'", "mode='same'",
]

# Reading A is `expected`; reading B is below.
[readings]
same = "output keeps the input length, zero-padded at the edges, centred the way MATLAB's conv 'same' does"
same_numpy = "the same, centred the way numpy's convolve 'same' does (differs from the above only for even k)"
