[task]
id = "t05_rk4_fit"
function = "rk4_fit"
trap = "indexing, ordering and least squares"

[outputs]
names = ["Y", "c", "yflat"]

# Y and yflat: the same arithmetic in the same order, so they can only differ in the last bits
# (a few ulps per step, at most 20 steps).
[tolerance]
rtol = 1e-12
atol = 1e-12

# c comes from a least-squares solve (QR in Octave, SVD in numpy). The condition number of the 3-column
# matrix is 15.8 to 21.0 across the cases, so a good solver's error is about cond * eps = 5e-15. A
# legitimate alternative, solving the normal equations, squares the condition number: about
# cond^2 * eps = 1e-13. The tolerance must accept that, and it still rejects the wrong answers
# (a reversed coefficient order differs at order 1), so it sits well above both.
[tolerance.c]
rtol = 1e-8
atol = 1e-10

# Orientation is not what this task tests: a 1-D result is accepted for the 3x1 c and the flattened column.
[shape]
vector_ok = true

[inputs]
order = ["h", "N"]
as_int = ["N"]

# Octave results of common wrong translations -> failure signature they indicate.
# Each variant changes exactly one output and leaves the other two correct.
[known_wrong]
ravel_rowmajor = "permuted-output"
coef_order_reversed = "permuted-output"

# Ambiguity variant: the same function, described in words instead of shown as code. Reading A is the
# key. Each reading below changes one thing and covers only the outputs it concerns.
#
# `vocabulary` is the words a reply uses when it says something about one of the vague points (is the
# start state returned, which way round the coefficients are, which way the states are flattened).
[ambiguity]
function = "rk4_fit"
outputs = ["Y", "c", "yflat"]
vocabulary = [
  "initial", "initial condition", "starting state", "start state", "starting point", "after the start",
  "first state", "t=0", "t = 0", "time zero", "drop", "dropped", "omit", "omitted", "first column", "n+1", "n + 1", "include",
  "includes", "including", "exclude", "excludes", "excluding", "highest", "lowest", "descending", "ascending",
  "constant term", "intercept", "polyfit", "row-major", "column-major", "row by row", "column by column",
  "row-wise", "column-wise", "ravel", "ordering", "coefficient order", "highest power", "lowest power",
]

[readings]
no_initial = "the returned states are only the N after the start; the fit uses their own times (outputs Y, c, yflat)"
coef_highest_first = "'the coefficients of the quadratic' listed highest power first, like np.polyfit (output c)"
row_by_row = "'flattened into a single column' reading row by row, like numpy's ravel (output yflat)"
