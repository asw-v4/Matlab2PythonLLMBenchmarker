[task]
id = "t04_robust_stats"
function = "robust_stats"
trap = "silent numerical drift"

[inputs]
order = ["x", "a", "b", "u", "w"]

[outputs]
names = ["s", "v", "r", "m", "rm", "sat"]

# std and var are sums of a few doubles. The other four outputs are whole numbers and must match exactly.
[tolerance]
rtol = 1e-12
atol = 1e-12
exact_outputs = ["r", "m", "rm", "sat"]

# Orientation is not what this task tests, so a 1-D result is accepted for a row.
[shape]
vector_ok = true

# Octave results of common wrong translations -> failure signature they indicate.
# Each variant changes exactly one thing and leaves the other outputs correct.
[known_wrong]
ddof0 = "scale-mismatch"
round_half_even = "rounding-mismatch"
rem_as_mod = "sign-mismatch"
mod_as_rem = "sign-mismatch"
wraparound = "wraparound-mismatch"

# Ambiguity variant: the same function, described in words instead of shown as code. Reading A is the
# key. Each phrase of the description is open in the way the matching trap is, so each known-wrong
# translation above is also a valid reading B of one phrase. A reading covers only the outputs it
# concerns; all other outputs have just the one sensible reading.
[ambiguity]
function = "robust_stats"
outputs = ["s", "v", "r", "m", "rm", "sat"]

[readings]
population = "'standard deviation' and 'variance' dividing by n instead of n-1 (outputs s, v)"
half_even = "'rounded to whole numbers' sending halves to the nearest even number (output r)"
truncated_modulo = "'modulo' taking the sign of the dividend, like C's % (output m)"
floored_remainder = "'remainder' taking the sign of the divisor, like Python's % (output rm)"
wraparound = "'u plus w' wrapping around at 256 (output sat)"
