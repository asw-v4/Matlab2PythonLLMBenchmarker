[project]
name = "matlab2py-bench"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
convert = [
    "hf-xet>=1.7.0",
    "huggingface-hub>=0.36.2",
    "numpy~=2.2.6",
    "protobuf>=4.21.0,<5.0.0",
    "sentencepiece>=0.2.2",
    "torch==2.11.0",
    "transformers==4.57.6",
]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
